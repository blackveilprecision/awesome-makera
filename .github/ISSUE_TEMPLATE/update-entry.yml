name: Fix or remove an entry
description: Fix a broken link, outdated description, name or section, or ask for an entry to be removed. A bot checks it and opens the pull request.
title: "Update: "
labels: ["entry update"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in only what should change. A bot finds the entry, applies your change, checks the links, runs an automated review, and opens the pull request for you.

        You can edit this issue at any time. The bot re-checks it automatically. Removals are always confirmed by a maintainer.
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The entry's current link, copied from the list. Its exact name works too.
      placeholder: https://github.com/MakeraInc/CarveraController
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What should happen?
      options:
        - Change it
        - Remove it from the list
    validations:
      required: true
  - type: input
    id: new_url
    attributes:
      label: New link
      description: Leave empty to keep the current link.
    validations:
      required: false
  - type: input
    id: new_source
    attributes:
      label: New source code link
      description: Optional. Adds or replaces the entry's source-code link (for web apps and sites). Type "remove" to drop it.
    validations:
      required: false
  - type: input
    id: new_name
    attributes:
      label: New name
      description: Leave empty to keep the current name.
    validations:
      required: false
  - type: textarea
    id: new_description
    attributes:
      label: New description
      description: One sentence. Leave empty to keep the current description. The bot may tidy the wording.
    validations:
      required: false
  - type: dropdown
    id: new_section
    attributes:
      label: New section
      description: Leave empty to keep the current section.
      options:
        # categories:start
        - "Official Resources"
        - "Machines"
        - "Controllers & Apps"
        - "Firmware"
        - "CAM & Post-Processors"
        - "Macros & Utilities"
        - "Accessories"
        - "Upgrades & Printable Mods"
        - "Tooling & Workholding"
        - "Guides & Tutorials"
        - "Videos"
        - "Communities"
        - "Related Lists"
        # categories:end
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: For example "the project moved to a new site" or "archived since 2021, no releases".
    validations:
      required: true
