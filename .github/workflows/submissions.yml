# Checks "Suggest a resource" and "Fix or remove an entry" issue forms, posts the result,
# and opens a pull request with the change once it's approved. See MAINTAINERS.md.
name: Submissions

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check again
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue }}

jobs:
  process:
    # Runs for issues made with either form, recognised by label or by the form's headings (GitHub only
    # applies a form's label once the label exists), when a maintainer adds `approved`, or when started
    # by hand from the Actions tab. Label names must match .github/awesome-bot.json.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'approved') ||
      (github.event.action != 'labeled' && (
        contains(github.event.issue.labels.*.name, 'submission') ||
        contains(github.event.issue.labels.*.name, 'entry update') ||
        (contains(github.event.issue.body, '### Link') && contains(github.event.issue.body, '### Category')) ||
        contains(github.event.issue.body, '### What should happen?')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Check submission or update request
        run: python3 -m awesome_bot process-issue --issue "$ISSUE"
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PYTHONPATH: .github/scripts
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: bill AI usage to a specific Copilot seat instead (fine-grained PAT, "Copilot Requests" permission).
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Optional: use your own model provider instead of Copilot. See MAINTAINERS.md.
          COPILOT_PROVIDER_BASE_URL: ${{ vars.COPILOT_PROVIDER_BASE_URL }}
          COPILOT_PROVIDER_TYPE: ${{ vars.COPILOT_PROVIDER_TYPE }}
          COPILOT_PROVIDER_API_KEY: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
